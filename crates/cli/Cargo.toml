[package]
name = "woomy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
[[bin]]
name = "woomy"
path = "src/main.rs"
[dependencies]
woomy-core = { path = "../core" }
woomy-ai = { path = "../ai" }
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
rpassword = "7"
shlex = "1"
zeroize = "1"
[dev-dependencies]
tempfile.workspace = true
[lints]
workspace = true
